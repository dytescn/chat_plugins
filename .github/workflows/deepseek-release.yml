name: Release deepseek

on:
  push:
    tags:
      - "deepseek-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./deepseek/dytes.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#deepseek-v}"
            if [ "$tag" != "$version" ]; then
              echo "tag ${GITHUB_REF_NAME} 与 deepseek/dytes.json 版本 ${version} 不一致" >&2
              exit 1
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.platform }}
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform: [windows, linux, macos]
    runs-on: ${{ matrix.platform == 'windows' && 'windows-latest' || matrix.platform == 'macos' && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build deepseek
        shell: bash
        run: cargo build --release --manifest-path deepseek/Cargo.toml

      - name: Publish deepseek with dytes
        uses: dytescn/dytes@v0.1.16
        with:
          command: publish
          dir: deepseek
