name: Release reply_base_call

on:
  push:
    tags:
      - "reply_base_call-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    uses: ./.github/workflows/publish-package.yml
    with:
      package: reply_base_call
      kind: code
      # mcp.json 使用 plugin_lib 规范的对象数组格式；旧版 dytes 清单校验
      # 仍把 tools 当作文件名数组，因此发布时跳过 check。
      args: --skip-check
